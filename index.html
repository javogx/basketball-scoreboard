<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="home">
            <p style="color: #D4D5DA;">HOME</p>
            <p class="number" id="count-home">0</p>
            <button id="plus-one" onclick="plusOneHome()">+1</button>
            <button id="plus-two" onclick="plusTwoHome()">+2</button>
            <button id="plus-three" onclick="plusThreeHome()">+3</button>
            <button id="reset" onclick="resetHome()">Reset</button>
        </div>
        <div class="guest">
            <p style="color: #D4D5DA;">GUEST</p>
            <p class="number" id="count-guest">0</p>
            <button id="plus-one" onclick="plusOneGuest()">+1</button>
            <button id="plus-two" onclick="plusTwoGuest()">+2</button>
            <button id="plus-three" onclick="plusThreeGuest()">+3</button>
            <button id="reset" onclick="resetGuest()">Reset</button>
        </div>
        <button class="NewGame" onclick="restart()">NEW GAME</button>
    </div>




    <script src="script.js"></script>
</body>
</html>
